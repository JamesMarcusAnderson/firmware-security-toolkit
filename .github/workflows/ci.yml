name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m py_compile fwtool/detect.py fwtool/strings.py fwtool/sections.py fwtool/vuln.py fwtool/main.py
      - run: python -m pytest tests -q
      - run: python -c "import json; json.load(open('docs/sample-report.json'))"
