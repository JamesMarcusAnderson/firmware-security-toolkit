name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m py_compile firmwarescope/detect.py firmwarescope/strings.py firmwarescope/sections.py firmwarescope/vuln.py firmwarescope/main.py
      - run: python -m pytest tests -q
      - run: python -c "import json; json.load(open('docs/sample-report.json'))"
