name: release
# Builds one-file firmwarescope executables for Linux, Windows, and macOS.
# Runs on every push (artifacts only) and on version tags (GitHub Release).
# The Linux binary is also built and verified locally; Windows and macOS
# binaries ONLY exist once this workflow has run — they cannot be built
# on a Linux machine.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: firmwarescope-1.0.0-linux-x86_64
          - os: windows-latest
            asset: firmwarescope-1.0.0-windows-x86_64.exe
          - os: macos-latest
            asset: firmwarescope-1.0.0-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm firmwarescope.spec
      - run: |
          if [ -f dist/firmwarescope.exe ]; then mv dist/firmwarescope.exe "dist/${{ matrix.asset }}";
          else mv dist/firmwarescope "dist/${{ matrix.asset }}"; fi
        shell: bash
      - run: ./dist/${{ matrix.asset }} --version
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh needs a git checkout to resolve the repo; without it the upload
      # fails with "fatal: not a git repository" (run #3, 2026-11-24).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - run: |
          gh release upload "${{ github.ref_name }}" artifacts/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
